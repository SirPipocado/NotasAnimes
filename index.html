body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.toolbar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

input, select, button {
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #1e293b;
  color: white;
  outline: none;
}

input { width: 250px; border: 1px solid #334155; }
button { cursor: pointer; background: #3b82f6; font-weight: bold; }
button:hover { background: #2563eb; }

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, 220px);
  justify-content: center;
  gap: 20px;
}

.card {
  width: 220px;
  background: #1e293b;
  border-radius: 16px;
  overflow: hidden;
  transition: 0.3s;
  display: flex;
  flex-direction: column;
  position: relative;
}

.card:hover { transform: scale(1.05); }

.banner {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
}

.content {
  padding: 14px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.title { font-size: 15px; font-weight: bold; }
.info { margin: 5px 0 10px 0; font-size: 13px; color: #cbd5f5; }
.desc { font-size: 13px; color: #94a3b8; line-height: 1.4; }

.card.dropado { background: #3a2e0f; border: 2px solid #facc15; }
.drop-label {
  position: absolute;
  top: 8px;
  left: 8px;
  background: #facc15;
  color: #000;
  font-weight: bold;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  z-index: 10;
}
</style>
</head>

    img: "https://m.media-amazon.com/images/M/MV5BZjAwMGM4NzAtNzMxNi00NGExLWE5MmItOGMzNWJhODI0MTcxXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
    desc: "???"
  },
];

const container = document.querySelector(".container");
const inputBusca = document.getElementById("search");
const selectFiltro = document.getElementById("filtro");
const btnOrdem = document.getElementById("ordem");

let ordemCrescente = true;

function renderizar(lista) {
  container.innerHTML = "";
  const html = lista.map(anime => `
    <div class="card ${anime.dropado ? "dropado" : ""}">
      ${anime.dropado ? `<div class="drop-label">DROPADO</div>` : ""}
      <img class="banner" src="${anime.img}">
      <div class="content">
        <div class="title">${anime.nome}</div>
        <div class="info">
          <div>⭐ ${anime.nota.toFixed(1)}</div>
          <div>🎙️ ${anime.dublado ? "Dublado" : "Legendado"}</div>
          <div>📺 ${anime.finalizado ? "Finalizado" : "Não finalizado"}</div>
          <div>📊 Eps: ${anime.eps}</div>
          ${anime.filmes > 0 ? `<div>🎬 Filmes: ${anime.filmes}</div>` : ""}
        </div>
        <div class="desc">${anime.desc}</div>
      </div>
    </div>
  `).join('');
  container.innerHTML = html;
}

function filtrarEOrdenar() {
  const termo = inputBusca.value.toLowerCase();
  const tipoFiltro = selectFiltro.value;

  let resultado = animes.filter(anime => 
    anime.nome.toLowerCase().includes(termo)
  );

  resultado.sort((a, b) => {
    let valA, valB;
    if (tipoFiltro === "nome") {
      valA = a.nome.toLowerCase();
      valB = b.nome.toLowerCase();
    } else if (tipoFiltro === "nota") {
      valA = a.nota;
      valB = b.nota;
    } else {
      valA = animes.indexOf(a);
      valB = animes.indexOf(b);
    }

    if (valA < valB) return ordemCrescente ? -1 : 1;
    if (valA > valB) return ordemCrescente ? 1 : -1;
    return 0;
  });

  renderizar(resultado);
}

inputBusca.addEventListener("input", filtrarEOrdenar);
selectFiltro.addEventListener("change", filtrarEOrdenar);
btnOrdem.addEventListener("click", () => {
  ordemCrescente = !ordemCrescente;
  btnOrdem.innerText = ordemCrescente ? "⬆️ Crescente" : "⬇️ Decrescente";
  filtrarEOrdenar();
});
  
renderizar(animes);
</script>

</body>
</html>
